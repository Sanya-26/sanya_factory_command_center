[build]
  command = "npm run build"
  publish = "dist"

[env]
  VITE_DATA_BACKEND = "mock"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Monday.com API proxy for development only — production uses Edge Functions
[[redirects]]
  from = "/api/monday"
  to = "https://api.monday.com/v2"
  status = 200
  force = false

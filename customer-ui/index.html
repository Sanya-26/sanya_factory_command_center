    <!-- Geist Sans: Vercel's neutral 2026-grade sans. Reads sharper than
         Inter at body sizes, has a tighter optical rhythm, and avoids the
         "every SaaS uses Inter" cliché the taste-skill called out.
         Preconnect cuts ~150ms off the first font fetch. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
    />
